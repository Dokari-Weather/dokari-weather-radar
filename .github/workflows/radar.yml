name: Global Weather Radar
on:
  schedule:
    - cron: '13 5,11,17 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public results
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collector.py
      - name: Commit updated feed
        run: |
          git config user.name 'dokari-radar-bot'
          git config user.email 'radar-bot@users.noreply.github.com'
          git add docs/data.json
          git diff --cached --quiet || (git commit -m 'Update weather radar feed' && git push)
